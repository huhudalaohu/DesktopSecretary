<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Screenshot Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    #screenshot-bg {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      pointer-events: none;
    }
    #overlay-canvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
    }
    #hint {
      position: fixed; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      background: rgba(32,32,32,0.85); color: #fff;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 20px; border-radius: 8px;
      font-size: 13px; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      pointer-events: none; z-index: 10;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <img id="screenshot-bg" />
  <canvas id="overlay-canvas"></canvas>
  <div id="hint">Enter 确认窗口区域  |  Esc 取消  |  鼠标拖拽自定义选区</div>
  <script src="./screenshot-overlay.js"></script>
</body>
</html>
