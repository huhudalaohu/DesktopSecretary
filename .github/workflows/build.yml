name: DesktopSecretary CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 构建时注入云函数 URL(均为公开 HTTP 触发器地址,本身就会打进客户端包,非机密)
      - name: Write .env for build-time injection
        shell: bash
        run: |
          cat > .env <<'EOF'
          TCB_ENV_ID=ds-dev-d9g28xlrgd2600837
          AI_PROXY_URL=https://ds-dev-d9g28xlrgd2600837-1420931574.ap-shanghai.app.tcloudbase.com/ai-proxy
          GET_BALANCE_URL=https://ds-dev-d9g28xlrgd2600837-1420931574.ap-shanghai.app.tcloudbase.com/get-balance
          APP_CONFIG_URL=https://ds-dev-d9g28xlrgd2600837-1420931574.ap-shanghai.app.tcloudbase.com/app-config
          CREATE_RECHARGE_URL=https://ds-dev-d9g28xlrgd2600837-1420931574.ap-shanghai.app.tcloudbase.com/create-recharge
          QUERY_ORDER_URL=https://ds-dev-d9g28xlrgd2600837-1420931574.ap-shanghai.app.tcloudbase.com/query-order
          MOCK_PAY_URL=https://ds-dev-d9g28xlrgd2600837-1420931574.ap-shanghai.app.tcloudbase.com/mock-pay
          DIRECT_RECHARGE_URL=https://ds-dev-d9g28xlrgd2600837-1420931574.ap-shanghai.app.tcloudbase.com/direct-recharge
          EOF

      - name: Build frontend
        run: npm run build

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish=never --config.npmRebuild=false

      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish=never --config.npmRebuild=false

      # ========== 上传到 GitHub Release（包含 latest*.yml 元数据，必须）==========
      - name: Upload Windows assets to Release
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

      - name: Upload macOS assets to Release
        if: matrix.os == 'macos-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

      # ========== 构建产物归档（调试用，可在 Actions 页面下载）==========
      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSecretary-Windows
          path: |
            release/*.exe
            release/latest.yml

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSecretary-macOS
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
