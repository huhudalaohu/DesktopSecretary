name: DesktopSecretary CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:   # 手动触发：构建 + 上传 COS
  release:
    types: [published] # 发布 Release 时自动构建并上传产物

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish=never

      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish=never

      # ========== 自动上传到 GitHub Release ==========
      - name: Upload Windows assets to Release
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap

      - name: Upload macOS assets to Release
        if: matrix.os == 'macos-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip

      # ========== 手动触发时发布到 COS ==========
      - name: Publish to COS (Windows)
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: node scripts/build/publish.js --platform=win

      - name: Publish to COS (macOS)
        if: matrix.os == 'macos-latest' && github.event_name == 'workflow_dispatch'
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: node scripts/build/publish.js --platform=mac

      # ========== 构建产物归档（调试用）==========
      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSecretary-Windows
          path: release/*.exe

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSecretary-macOS
          path: |
            release/*.dmg
            release/*.zip
